# Copy to ~/.home-it/config.toml (NOT into the repo) and fill in.
# The repo is public: keep real hostnames, users and fingerprints out of git.

[synology]
host = "my-nas"                 # DNS name or IP of the DSM box
username = "svc-account"        # dedicated DSM admin used by the tooling
ssh_alias = "nas"               # Host alias in ~/.ssh/config
dsm_port = 5001                 # HTTPS DSM port
cert_sha256 = ""                # pin: `python -m homeit synology pin-cert`
keyring_service = "home-it/synology"
docker_bin = "/usr/local/bin/docker"
update_exclude = []             # container names the weekly image update skips

# Optional: `synology usb-sync` keeps a single-version Hyper Backup task's folder list current.
[synology.usb_backup]
task_name = "USB_Backup"        # Hyper Backup task name
roots = ["/media", "/docker"]   # share paths to back up
exclude = ["/media/downloads", "/media/TV/<show>"]   # paths inside roots to leave out
protect = ["/media/TV/<must-keep show>"]             # abort (critical alert) if these would not be backed up
max_drop_pct = 10               # refuse to drop more than this % of entries in one run (unless --force)

[homeassistant]
url = "http://my-nas:8123"      # LAN URL of the Home Assistant container
keyring_service = "home-it/homeassistant"
token_name = "<svc-user>"       # long-lived access token of the dedicated HA user, stored in the keyring
host_config_dir = "/volume1/docker/homeassistant"  # HA /config folder on the NAS, used by `ha deploy-panel`
